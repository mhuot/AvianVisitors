<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 800" width="1060" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Mouth closure detail: ePTFE membrane on a stainless mesh backing</title>
  <desc id="desc">Enlarged section through the mouth of the mic housing. An ePTFE membrane lies across the full bore on the outboard face, backed immediately inboard by stainless mesh. A printed retainer ring press-fits into the bore and clamps both, with the membrane turned up between the retainer and the bore wall. A drip lip collar slides over the pipe outside diameter and stands proud of the mouth. Because the aperture remains the full bore rather than a small port, the closure adds flow resistance but forms no Helmholtz neck.</desc>

  <style>
    .bgfill   { fill: #ffffff; }
    .pvc-f    { fill:   #d8dce1; }
    .edge     { stroke: #5b6470; }
    .printed-f{ fill:   #2f9e68; }
    .vent-f   { fill:   #d9682b; }
    .mesh-s   { stroke: #8b93a1; }
    .snd-s    { stroke: #3b82f6; }
    .snd-f    { fill:   #3b82f6; }
    .label    { fill:   #1f2430; }
    .sub      { fill:   #6b7280; }
    .lead     { stroke: #9aa1ad; }
    .dim      { stroke: #9aa1ad; }
    .dimf     { fill:   #9aa1ad; }

    @media (prefers-color-scheme: dark) {
      .bgfill   { fill: #14161a; }
      .pvc-f    { fill:   #3a4048; }
      .edge     { stroke: #98a2b3; }
      .printed-f{ fill:   #4ade80; }
      .vent-f   { fill:   #fb923c; }
      .mesh-s   { stroke: #6b7280; }
      .snd-s    { stroke: #60a5fa; }
      .snd-f    { fill:   #60a5fa; }
      .label    { fill:   #e5e7eb; }
      .sub      { fill:   #9ca3af; }
      .lead     { stroke: #6b7280; }
      .dim      { stroke: #6b7280; }
      .dimf     { fill:   #6b7280; }
    }

    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .t-title { font-size: 23px; font-weight: 600; }
    .t-sub   { font-size: 14px; }
    .t-lab   { font-size: 15px; }
    .t-small { font-size: 13px; }
  </style>

  <defs>
    <pattern id="mdet" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,0 L8,8 M8,0 L0,8" class="mesh-s" stroke-width="1.2" fill="none"/>
    </pattern>
    <marker id="snda" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,1.5 L8,5 L0,8.5 z" class="snd-f"/>
    </marker>
    <marker id="dima" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,1.2 L7,4.5 L0,7.8 z" class="dimf"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="800" class="bgfill"/>

  <text x="40" y="46" class="label t-title">Mouth closure — detail</text>
  <text x="40" y="70" class="sub t-sub">Membrane and mesh at the mouth. Layer thicknesses exaggerated ~20&#215; for clarity.</text>

  <!-- ============ pipe wall ============ -->
  <rect x="251" y="150" width="26" height="290" class="pvc-f"/>
  <rect x="251" y="150" width="26" height="290" class="edge" fill="none" stroke-width="1.4"/>
  <rect x="563" y="150" width="26" height="290" class="pvc-f"/>
  <rect x="563" y="150" width="26" height="290" class="edge" fill="none" stroke-width="1.4"/>

  <!-- ============ drip lip collar, over the pipe OD ============ -->
  <rect x="227" y="396" width="24" height="94" class="printed-f" opacity="0.55"/>
  <rect x="589" y="396" width="24" height="94" class="printed-f" opacity="0.55"/>

  <!-- ============ printed retainer ring ============ -->
  <rect x="285" y="372" width="56" height="52" class="printed-f"/>
  <rect x="499" y="372" width="56" height="52" class="printed-f"/>

  <!-- ============ stainless mesh backing, inboard ============ -->
  <rect x="285" y="424" width="270" height="12" fill="url(#mdet)"/>
  <rect x="285" y="424" width="270" height="12" class="mesh-s" fill="none" stroke-width="1.2"/>

  <!-- ============ ePTFE membrane, outboard, turned up at the rim ============ -->
  <rect x="277" y="436" width="286" height="8" class="vent-f"/>
  <rect x="277" y="380" width="8"  height="56" class="vent-f"/>
  <rect x="555" y="380" width="8"  height="56" class="vent-f"/>

  <!-- ============ sound path: full bore, unobstructed ============ -->
  <g class="snd-s" stroke-width="2.4" fill="none" marker-end="url(#snda)" opacity="0.9">
    <path d="M372,556 V352"/>
    <path d="M468,556 V352"/>
  </g>
  <text x="420" y="582" text-anchor="middle" class="sub t-small">sound in — through the full aperture</text>

  <!-- ============ bore dimension ============ -->
  <path d="M277,644 H563" class="dim" stroke-width="1.4" fill="none" marker-start="url(#dima)" marker-end="url(#dima)"/>
  <path d="M277,624 V656 M563,624 V656" class="dim" stroke-width="1" fill="none" opacity="0.7"/>
  <text x="420" y="638" text-anchor="middle" class="sub t-small">bore &#8960;40.9 — the aperture stays this wide</text>

  <!-- ============ leaders ============ -->
  <g class="lead" stroke-width="1.3" fill="none">
    <path d="M206,392 H283"/>
    <path d="M206,470 H239"/>
    <path d="M634,384 H559"/>
    <path d="M634,430 H470"/>
    <path d="M634,528 L500,448"/>
  </g>

  <g class="label t-lab">
    <text x="200" y="397" text-anchor="end">Printed retainer ring</text>
    <text x="200" y="475" text-anchor="end">Drip lip collar</text>
    <text x="642" y="389">Turned up at the rim</text>
    <text x="642" y="435">Stainless mesh backing</text>
    <text x="642" y="533">ePTFE membrane</text>
  </g>

  <g class="sub t-small">
    <text x="200" y="415" text-anchor="end">press fit; clamps the stack</text>
    <text x="200" y="493" text-anchor="end">slides over the pipe OD</text>
    <text x="642" y="407">trapped between retainer and bore</text>
    <text x="642" y="453">takes the wind and rain load, so the</text>
    <text x="642" y="470">membrane cannot drum</text>
    <text x="642" y="551">outboard — sheds water, stops insects</text>
    <text x="642" y="568">a service item: replace each spring</text>
  </g>

  <!-- ============ the point ============ -->
  <text x="40" y="706" class="label t-lab">Why this is not the capped-mouth mistake</text>
  <text x="40" y="729" class="sub t-small">A rigid cap vents ~1300 mm² of bore through a few mm² of port — that area ratio is what builds a</text>
  <text x="40" y="747" class="sub t-small">Helmholtz resonator near 240 Hz. A membrane spans the full bore, so there is no neck. It adds</text>
  <text x="40" y="765" class="sub t-small">distributed flow resistance, which damps the hood's own tube resonance rather than creating one.</text>
</svg>
